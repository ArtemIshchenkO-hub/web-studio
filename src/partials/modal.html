<div class="overlay" id="modal">
  <div class="modal">
    <button class="close-btn" type="button">
      <svg class="close-icon" width="8" height="8">
        <use href="./img/icons.svg#icon-close"></use>
      </svg>
    </button>
    <p class="modal-title text-centered">
      Leave your contacts and we will call you back
    </p>
    <form class="modal-form">
      <div class="modal-form-wrap">
        <div class="modal-form-fields">
          <div class="modal-form-field">
            <label class="modal-label" for="name">Name </label>
            <div class="modal-input-wrap">
              <input
                class="modal-input"
                type="text"
                name="name"
                id="name"
                placeholder="Alice"
              />

              <svg class="input-icon" width="18" height="24">
                <use href="./img/icons.svg#icon-person"></use>
              </svg>
            </div>
            <p class="error-message"></p>
          </div>
          <div class="modal-form-field">
            <label class="modal-label" for="phone">Phone</label>
            <div class="modal-input-wrap">
              <input
                class="modal-input"
                type="tel"
                name="tel"
                id="phone"
                placeholder="+380501234567"
              />

              <svg class="input-icon" width="18" height="24">
                <use href="./img/icons.svg#icon-phone"></use>
              </svg>
            </div>
            <p class="error-message"></p>
          </div>
          <div class="modal-form-field">
            <label class="modal-label" for="email">Email </label>
            <div class="modal-input-wrap">
              <input
                class="modal-input"
                type="email"
                name="email"
                id="email"
                placeholder="test@gmail.com"
              />

              <svg class="input-icon" width="18" height="24">
                <use href="./img/icons.svg#icon-email"></use>
              </svg>
            </div>
            <p class="error-message"></p>
          </div>
          <div class="modal-form-field">
            <label class="modal-label" for="comment">Comment</label>
            <textarea
              class="textarea"
              name="comment"
              placeholder="Write comment"
              id="comment"
            ></textarea>
            <p class="error-message"></p>
          </div>
        </div>
        <div class="modal-field">
          <input
            class="checkbox-input sr-only"
            type="checkbox"
            name="accept"
            id="accept"
          />
          <label class="checkbox-label" for="accept">
            <span class="checkbox-custom">
              <svg class="check-icon" width="10" height="8">
                <use href="./img/icons.svg#icon-check"></use>
              </svg>
            </span>
            <span class="checkbox-text"
              >I accept the terms and conditions of the
              <a href="#" class="checkbox-text-accent">Privacy Policy</a></span
            >
          </label>
        </div>
      </div>
      <button
        class="button button-text modal-button"
        type="submit"
        data-form-btn
      >
        Send
      </button>
    </form>
  </div>
</div>
