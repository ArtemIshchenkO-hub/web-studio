<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Web Studio</title>

    <link
      rel="preload"
      as="image"
      imagesrcset="img/bg/avif/hero-bg-mobile.avif 1x, img/bg/avif/hero-bg-mobile-x2x.avif 2x"
      type="image/avif"
      media="(max-width: 767px)"
    />

    <link
      rel="preload"
      as="image"
      imagesrcset="img/bg/avif/hero-bg-tablet.avif 1x, img/bg/avif/hero-bg-tablet-x2.avif 2x"
      type="image/avif"
      media="(min-width: 768px) and (max-width: 1157px)"
    />

    <link
      rel="preload"
      as="image"
      imagesrcset="img/bg/avif/hero-bg-desktop.avif 1x, img/bg/avif/hero-bg-desktop-x2.avif 2x"
      type="image/avif"
      media="(min-width: 1158px)"
    />

    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <load src="./partials/header.html" />

    <main>
      <load src="./partials/hero.html" />
      <load src="./partials/features.html" />
      <load src="./partials/team.html" />
      <load src="./partials/portfolio.html" />
    </main>

    <load src="./partials/footer.html" />
    <load src="./partials/modal.html" />
    <load src="./partials/mobile-menu.html" />

    <script type="module" src="./main.js"></script>
  </body>
</html>
