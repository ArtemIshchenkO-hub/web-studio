<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bg-gradient)" />

  <!-- Code brackets and letter W combination -->
  <g filter="url(#glow)">
    <!-- Opening bracket < -->
    <path d="M 20 22 L 12 32 L 20 42" fill="none" stroke="url(#accent-gradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Closing bracket > -->
    <path d="M 44 22 L 52 32 L 44 42" fill="none" stroke="url(#accent-gradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central letter W -->
    <path d="M 25 24 L 29 40 L 32 31 L 35 40 L 39 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
